[package]
name = "tt-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
tt-agentboard = { workspace = true }
tt-collect = { workspace = true }
tt-config = { workspace = true }
tt-git = { workspace = true }
# `tt open` is a client of the app's MCP endpoint: the tool call it makes and the
# per-checkout port it dials both live there, so neither is restated here.
tt-mcp = { workspace = true }
tt-exec = { workspace = true }
tt-journal = { workspace = true }
tt-tasks = { workspace = true }
tt-store = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
tt-telemetry = { workspace = true }
inquire = { workspace = true }
serde_json = { workspace = true }
# One loopback POST for `tt open`. Workspace-configured for `native-tls` like
# every other HTTP client here (the OS trust store rule in CLAUDE.md), even
# though this caller only ever talks to 127.0.0.1 over plain HTTP.
ureq = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.14.0"

[lints]
workspace = true
