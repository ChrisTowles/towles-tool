[package]
name = "tt-pane"
version = "0.1.0"
edition = "2021"
description = "Embeds tt-jarvis's Bevy renderer in a native surface inside the Tauri window"

# Not under `crates/`: this needs `tauri` to reach the host window, which the
# workspace's Tauri-free rule forbids there. The renderer itself stays in
# `crates/tt-jarvis`, which knows nothing about windows or IPC.

[dependencies]
tauri = { workspace = true }
tt-jarvis = { path = "../../crates/tt-jarvis", features = ["bevy"], optional = true }
tracing = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Must match the gtk that `tauri` links (0.18) — `gtk_window()` hands us its
# types, so a second gtk major in the tree would not typecheck.
gtk = { version = "0.18", optional = true }
wayland-client = { version = "0.31", optional = true }

[features]
# The renderer, and **off by default** — the one switch that decides whether
# Bevy is in the build at all. Off, this crate is the same stub it already
# compiles to off Linux: the four commands stay registered and `attach` reports
# the pane unsupported, which is what the frontend already handles. `tt-app`
# forwards a feature of the same name; see `crates/tt-jarvis/Cargo.toml` for why
# the default is off.
bevy = ["dep:tt-jarvis", "dep:gtk", "dep:wayland-client"]

[lints]
workspace = true
