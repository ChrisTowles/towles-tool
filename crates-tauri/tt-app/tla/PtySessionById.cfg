\* Expected to FAIL (PaneHasShell): kills and inserts by terminal id alone.
\* A disposed mount's late term_kill, a stale term_start's pre-kill, or its
\* insert lands on the next mount's shell; take_if_current then finds the id
\* empty, so no terminal://exit tells the pane its shell is gone.
SPECIFICATION Spec
CONSTANTS
  Views = {1, 2, 3}
  GenChecked = FALSE
INVARIANTS TypeOK PaneHasShell NoOrphanShell
CHECK_DEADLOCK FALSE
