[package]
name = "tt-jarvis"
version = "0.1.0"
edition = "2021"
description = "Bevy scene rendered into a surface it did not create — the native embedded pane"

[dependencies]
# NOTE: no direct `wgpu` dependency on purpose. We never name a wgpu type — the
# handles cross via `raw-window-handle` alone — and declaring a wgpu version
# here could put a second major in the tree, which would make two incompatible
# `RawWindowHandle` graphs and break the foreign-surface handoff. Let bevy own
# wgpu entirely.
raw-window-handle = { version = "0.6.2", optional = true }
# Not optional: `stats` is percentile maths with no Bevy in it, and stays
# compiled — and unit-tested — with the `bevy` feature off.
serde = { workspace = true }

# Bevy comes from **slyedoc's Solari fork**, not crates.io — see the Solari
# section in README.md. `solari-rt-pipeline` is the active branch (0.20.0-dev);
# Cargo.lock pins the exact revision, and `cargo update -p bevy` moves us onto
# newer work deliberately rather than silently.
[dependencies.bevy]
optional = true
git = "https://github.com/slyedoc/bevy"
branch = "solari-rt-pipeline"
default-features = false
features = [
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_asset",
  "bevy_log",
  "bevy_window",
  # Present for the *baseline* host only. `embedded_app` disables `WinitPlugin`
  # — the whole experiment is that the renderer does not need it.
  "bevy_winit",
  "multi_threaded",
  # Without this the tonemapping shader samples a missing LUT and the whole
  # scene renders magenta — Bevy's missing-texture fallback. A zstd backend is
  # its transitive requirement (the LUTs ship compressed). `zstd_c`, not the
  # pure-Rust `zstd_rust`: the fork pins `ruzstd` 0.8, which RUSTSEC-2026-0344
  # (decompression bomb) fixes only in 0.9, so the C backend is the one with
  # no open advisory. Back to `zstd_rust` once the fork takes ruzstd 0.9.
  "tonemapping_luts",
  "zstd_c",
  # Bloom, which lives in `bevy_post_process` as of 0.19+. The Jarvis scene is
  # emissive geometry on near-black — without bloom the rings are flat lines
  # rather than glowing ones, so this is load-bearing for the look, not polish.
  "bevy_post_process",
  # PNG encoding for `jarvis::capture_frame_after`. Without it the screenshot
  # observer runs and then fails at the encode step with "format Png is not
  # supported" — the capture path itself is fine.
  "png",
  "std",
  "x11",
  "wayland",
]

[features]
# The renderer itself, and **off by default**. Bevy builds from a git fork and a
# cold build of it dominates everything else in this workspace, while the pane it
# feeds is off by default in the product too (`agentboard.jarvisPane`). With this
# off the crate is `stats` alone and no Bevy enters the graph, so an ordinary
# build — local or CI — never pays for it. Reach it through `tt-pane`/`tt-app`'s
# feature of the same name, or directly:
#
#   cargo build -p tt-jarvis --features bevy
bevy = ["dep:bevy", "dep:raw-window-handle"]

[lints]
workspace = true
