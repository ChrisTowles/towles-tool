[package]
name = "comment-budget"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "A budget for comment volume: AI writes comments faster than anyone can review them, so cap how much commentary a reader wades through to reach the code."
keywords = ["comments", "ai", "tree-sitter", "ci", "code-quality"]
categories = ["development-tools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChrisTowles/towles-tool"
homepage = "https://github.com/ChrisTowles/towles-tool/tree/main/crates/comment-budget"
readme = "README.md"
# The npm packaging is a release input, not something a crates.io consumer gets
# — and the tests that guard it read files under `npm/`, so shipping them would
# ship a test suite that cannot pass.
exclude = ["npm", "tests/npm_pins.rs", "tests/npm_postinstall.rs"]

[lib]
name = "comment_budget"
path = "src/lib.rs"

[[bin]]
name = "comment-budget"
path = "src/bin/comment-budget.rs"

# Declared here rather than inherited from the workspace: this crate is
# published, so its dependency contract is its own. `gix` in particular — the
# workspace pulls `status`/`dirwalk`/`index`/`attributes` for the app's git
# pane, and inheriting that would push all of it onto anyone who installs the
# linter, which only ever reads a base tree and diffs two blobs.
[dependencies]
gix = { version = "0.86.0", features = ["blob-diff", "revision"] }
glob = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "1.1.4"
tree-sitter = "0.26"
tree-sitter-hcl = "1.1.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
