[package]
name = "comment-budget"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A zero-config ratchet on comment volume: a change may not grow a file's comment excess, nor add a wall of comment."
keywords = ["comments", "ai", "tree-sitter", "ci", "code-quality"]
categories = ["development-tools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ChrisTowles/towles-tool"
homepage = "https://github.com/ChrisTowles/towles-tool/tree/main/crates/comment-budget"
readme = "README.md"
# The npm and PyPI packaging are release inputs, not something a crates.io consumer gets
# — and the tests that guard it read files under `npm/`, so shipping them would
# ship a test suite that cannot pass.
exclude = ["npm", "pyproject.toml", "tests/npm_pins.rs", "tests/npm_postinstall.rs"]

# Declared here rather than inherited from the workspace: this crate is
# published, so its dependency contract is its own.
[dependencies]
gix = { version = "0.86.0", features = ["blob-diff", "revision", "dirwalk"] }
tree-sitter = "0.26"
tree-sitter-hcl = "1.1.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
serde_json = "1.0.145"
