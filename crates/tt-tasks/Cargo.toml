[package]
name = "tt-tasks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = { workspace = true }
# `kill(2)` on a process group, for clearing a stale dev server off a task's
# claimed port (`ports::stop_listeners`). Shelling out to `kill(1)` instead
# would be ambiguous: procps parses a leading `-<pgid>` as a signal number.
libc = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Claim/release events for the local telemetry log — the port registry's
# writes are exactly the kind of after-the-fact question ("who claimed 42410
# and when was it released?") the event log exists to answer.
tracing = { workspace = true }
tt-config = { workspace = true }
tt-exec = { workspace = true }
# Branch-name slug and validation (`branch_name`), and main-checkout lookup, so the
# suggestion fallback and ref rules cannot drift from the shared ones.
tt-git = { workspace = true }
# `ops::sync_task_branch` writes the board row it re-reads git for.
tt-store = { workspace = true }

[dev-dependencies]
tt-git = { workspace = true, features = ["test-support"] }
# Property tests for the envfile parse/merge invariants — the seam every
# port claim and inherited secret passes through.
proptest = "1.6.0"
tempfile = "3.14.0"

[lints]
workspace = true
