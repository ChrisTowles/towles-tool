\* Expected to FAIL (IdleIsNotBusy): note_output storing last_output_ms
\* before a fresh run's output_since_ms. A read between the two stores pairs
\* the new frame with the previous run's start, so one idle repaint reads as
\* a second of work.
SPECIFICATION Spec
CONSTANTS
  ActiveTicks = 3
  SustainTicks = 2
  GraceTicks = 4
  TwitchGap = 4
  SinceFirst = FALSE
  MaxT = 16
INVARIANTS TypeOK WorkShowsBusy AskingShowsWaiting IdleIsNotBusy AnswerClears
CHECK_DEADLOCK FALSE
