\* Expected to FAIL (FreshMeansCurrent): store_git_info blind to what
\* happened since the claim. An invalidation that lands mid-compute is
\* overwritten by the pre-change result stamped fresh, so the rail holds
\* stale stats until the TTL.
SPECIFICATION Spec
CONSTANTS
  Pollers = {scan, poll}
  MaxCommits = 3
  ClaimAware = FALSE
INVARIANTS TypeOK FreshMeansCurrent
CHECK_DEADLOCK FALSE
