\* Expected to FAIL (IdleIsNotBusy): the shipped constants hold only while a finished pane
\* repaints less often than OUTPUT_ACTIVE_MS. At one repaint a second the
\* repaints chain into one run that sustained_run reads as work.
SPECIFICATION Spec
CONSTANTS
  ActiveTicks = 3
  SustainTicks = 2
  GraceTicks = 4
  TwitchGap = 2
  SinceFirst = TRUE
  MaxT = 16
INVARIANTS TypeOK WorkShowsBusy AskingShowsWaiting IdleIsNotBusy AnswerClears
CHECK_DEADLOCK FALSE
