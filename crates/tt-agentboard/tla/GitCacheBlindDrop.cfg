\* Expected to FAIL (DroppedStaysDropped): the same blind store after task
\* removal. A compute in flight when drop_git_cache runs re-inserts the
\* removed checkout's entry, and a new task at that path inherits its stats.
SPECIFICATION Spec
CONSTANTS
  Pollers = {scan, poll}
  MaxCommits = 3
  ClaimAware = FALSE
INVARIANTS TypeOK DroppedStaysDropped
CHECK_DEADLOCK FALSE
