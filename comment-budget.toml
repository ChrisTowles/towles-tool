# comment-budget.toml
#
# One question, everywhere: how much prose must a reader wade through
# to reach the code?
#
# ratio = comment_lines / (comment_lines + code_lines)     blank lines ignored
#         so 0.15 means "1 line in 7 is prose", NOT comments-per-code-line
#
# Reference points measured 2026-07-28:
#   yaak (an app like ours)   rust 3.6%   ts 5.8%   tsx 1.6%
#   bevy (a published API)    rust 22.4%            <- deliberately NOT our target
#   here, today               rust 23.1%  ts 36.8%  tsx 14.8%
#
# `surface.file` fires only when ratio AND lines both exceed the tier. Both at
# once on purpose: mass alone flags a big well-commented file, ratio alone flags
# a tiny stub whose three doc lines are 40% of nothing. Neither is the thing
# being hunted, which is a file a reader has to wade through.

# Paths never measured, matched against any path component or prefix.
# `components/ui` is vendored shadcn. Dot-directories are always skipped.
skip = ["node_modules", "target", "dist", "apps/client/src/components/ui"]

# ---------------------------------------------------------------------------
# Kinds. `grammar` picks the tree-sitter grammar whose comment nodes are read
# (`prose` parses nothing and measures length instead); `extensions` binds the
# kind to files. `exempt` prefixes are not counted as comment OR code — they are
# invisible to every signal. `counted` is the bloat being measured. A comment
# matching neither counts, so a new syntax can't slip through unmeasured.
#
# `exempt_free` is what stops `exempt` being a hiding place. Only a file's first
# N exempt lines are invisible; the rest count like any other comment, and form
# a normal run. Without it the cheapest way to pass this linter is to move prose
# out of `///` and into `//!`, which shortens nothing for a reader. 12 sits above
# the repo's median header (10) and well under the outliers it is meant to catch.
# ---------------------------------------------------------------------------

[kinds.rust]
grammar    = "rust"
extensions = ["rs"]
exempt     = ["//!"]              # module docs: where hard-won "why" lives
exempt_free = 12                  # ...but only this many lines; see below
counted    = ["///", "//"]        # item docs and narration: the actual bloat

[kinds.typescript]
grammar    = "typescript"         # TS is a superset, so .js/.mjs read with it too
extensions = ["ts", "js", "mjs", "cjs"]
exempt     = []
counted    = ["//", "/*", "/**"]

[kinds.tsx]
grammar    = "tsx"
extensions = ["tsx"]
exempt     = []
counted    = ["//", "/*", "/**"]

[kinds.markdown]
grammar    = "prose"
extensions = ["md"]

# ---------------------------------------------------------------------------
# Surfaces. First match wins; a file no surface claims is not measured at all.
# `goal` is prose for humans; `target` is the number the linter aims at, and is
# reported per surface rather than enforced; warn/error are the enforcement band
# around it.
# ---------------------------------------------------------------------------

[[surface]]
name   = "shared-libraries"
paths  = ["crates/*/src/**/*.rs"]
goal   = "Two internal consumers, not a published API. Document the module and the crossing points; not every pub item."
target = 0.08
[surface.file]
warn  = { ratio = 0.10, lines = 50 }
error = { ratio = 0.12, lines = 100 }
[surface.run]
warn = 8                                # module docs are exempt, so a long //! header is fine
error = 14

[[surface]]
name   = "application-rust"
paths  = ["crates-tauri/**/*.rs", "crates-cli/**/*.rs"]
goal   = "No external API. Comment the surprise, never the signature."
target = 0.09
[surface.file]
warn  = { ratio = 0.14, lines = 40 }
error = { ratio = 0.22, lines = 80 }
[surface.run]
warn = 6
error = 10

[[surface]]
name   = "client-logic"
paths  = ["apps/client/src/**/*.ts"]
goal   = "Types are the documentation. Prose only for a race, an ordering constraint, or a WebKit quirk."
target = 0.08
[surface.file]
warn  = { ratio = 0.12, lines = 30 }
error = { ratio = 0.20, lines = 60 }
[surface.run]
warn = 5
error = 8

[[surface]]
name   = "client-components"
paths  = ["apps/client/src/**/*.tsx"]
goal   = "JSX describes itself. A file-top block only when the component encodes a non-obvious rule."
target = 0.05
[surface.file]
warn  = { ratio = 0.08, lines = 25 }
error = { ratio = 0.15, lines = 50 }
[surface.run]
warn = 4
error = 6

# Not in the original proposal, and without it these are measured by nothing.
# Every file a kind can read must land on some surface — an unclaimed one is a
# hard error, so this list is complete by construction rather than by memory.
#
# Each glob names its extension rather than ending in `**/*`: a bare wildcard
# claims the directory's `.md` too, and a surface with only ratio tiers has
# nothing that can fire on prose — which reads exactly like passing.
[[surface]]
name   = "dev-tooling"
paths  = [
  "scripts/**/*.mjs",
  "e2e/**/*.ts",
  "crates/*/npm/**/*.js",          # the npm wrapper's install-time glue
  "crates/*/tests/**/*.rs",
  "crates/*/examples/**/*.rs",
  "crates/*/benches/**/*.rs",
  "crates/*/build.rs",
  "apps/client/*.ts",              # vite.config.ts, vitest.config.ts
]
goal   = "Read when it breaks, by someone who did not write it. Say what the tool is for and what would surprise them; skip the walkthrough."
target = 0.12
[surface.file]
warn  = { ratio = 0.18, lines = 40 }
error = { ratio = 0.28, lines = 80 }
[surface.run]
warn = 6
error = 12

[[surface]]
name   = "committed-markdown"
paths  = ["**/*.md"]
goal   = "Prose has no code to sit against, so length is the only signal it offers."
target = { lines = 150 }
warn   = { lines = 150 }
error  = { lines = 250 }

# ---------------------------------------------------------------------------
[escape]
# A file may opt out with a top-of-file directive naming a reason.
# Reason is required — an unexplained opt-out is the failure mode.
directive = "comment-budget: allow(<reason>)"
