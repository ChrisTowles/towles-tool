name: Build

# The one desktop-app build, called by main-build.yml (every push to main) and
# release.yml (a published release). Both sign the updater artifacts with
# TAURI_SIGNING_PRIVATE_KEY: `createUpdaterArtifacts` fails the bundle without
# it, so main proves the release path works, not just that it compiles.
on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      name:
        required: true
        type: string
      args:
        required: false
        type: string
        default: ""
      # tauri-action uploads the bundles, their signatures and latest.json to
      # this release: release.yml's draft, or main-build.yml's rolling prerelease.
      release-id:
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: false
      # A release compiles clean, so no stale cached native lib ships.
      no-cache:
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Pinned ghostty commit tt-vt builds against — kept in sync with ci.yml.
  GHOSTTY_COMMIT: fdbf9ff3a31d7531b691cb49c98fc465a1a503a0

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Same pin, and the same strip of stray toolchains, as ci.yml's `rust` job.
      - name: Provision pinned Rust toolchain
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | awk '{print $1}')
          for tc in $(rustup toolchain list | awk '{print $1}'); do
            [ "$tc" = "$active" ] || rustup toolchain uninstall "$tc"
          done

      - name: Add macOS Rust target
        if: startsWith(inputs.platform, 'macos')
        run: rustup target add aarch64-apple-darwin

      # zig 0.15.x can't link against Xcode 26.4's SDK (ziglang/zig#31658):
      # select the newest older Xcode still on the image, if any.
      - name: Work around zig/Xcode 26.4 linker bug (ziglang/zig#31658)
        if: startsWith(inputs.platform, 'macos')
        run: |
          for dir in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -rV); do
            version=$(basename "$dir" .app | sed 's/Xcode_//')
            if [ "$(printf '%s\n26.4\n' "$version" | sort -V | head -1)" != "26.4" ]; then
              sudo xcode-select -s "$dir/Contents/Developer"
              echo "Selected $dir for zig build (avoiding the 26.4 SDK bug)"
              exit 0
            fi
          done
          echo "::warning::No pre-26.4 Xcode found on this runner; zig build may hit ziglang/zig#31658"

      - name: Cache apt packages
        if: startsWith(inputs.platform, 'ubuntu')
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-tauri-deps-${{ runner.os }}

      - name: Install Tauri system dependencies (Linux)
        if: startsWith(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Provision Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          use-cache: false

      # A shipped binary runs on CPUs other than the runner's.
      - uses: ./.github/actions/zig-baseline

      - name: Cache ghostty source
        id: ghostty-cache
        uses: actions/cache@v6
        with:
          path: ghostty-src
          key: ghostty-src-${{ runner.os }}-${{ env.GHOSTTY_COMMIT }}

      - name: Clone ghostty source
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/ghostty-org/ghostty.git ghostty-src
          git -C ghostty-src checkout "$GHOSTTY_COMMIT"

      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.no-cache }}
        with:
          key: build-${{ inputs.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Node is still the runtime: `bun run build` honours the node shebang on
      # vite's bin, which is what makes NODE_OPTIONS below take effect.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Build (and, for a release, upload)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHOSTTY_SOURCE_DIR: ${{ github.workspace }}/ghostty-src
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The monaco-vscode-api bundle overruns V8's default heap on macOS.
          NODE_OPTIONS: "--max-old-space-size=4096"
        with:
          releaseId: ${{ inputs.release-id }}
          args: ${{ inputs.args }}

      - name: Upload bundles
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: towles-tool-${{ inputs.name }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 30
