name: Frontend

on:
  push:
    branches: [main]
    paths: &client-paths
      - "apps/client/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths: *client-paths

# Cancel superseded runs on the same ref to keep CI fast.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Node is still the runtime for the scripts/*.mjs dev tooling below; Bun
      # is the package manager and script runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Bun workspaces: install from the repo root so apps/client resolves.
      # `--frozen-lockfile` makes CI fail rather than silently resolve a
      # dependency the committed bun.lock doesn't already pin.
      - name: bun install
        run: bun install --frozen-lockfile
        working-directory: .

      # Dev-tooling scripts (per-task port derivation) — run from the repo root.
      # `.mjs` sources, typechecked via JSDoc + checkJs (scripts/tsconfig.json).
      - name: typecheck scripts
        run: bun run typecheck:scripts
        working-directory: .

      - name: test scripts
        run: bun run test:scripts
        working-directory: .

      - name: typecheck
        run: bunx tsc -b

      # oxlint over apps/client. The repo documents oxlint *warnings* as
      # non-blocking, but `bun run lint` (oxlint .) only exits non-zero on
      # errors, and the tree is currently clean — so a non-zero exit here is a
      # real regression worth blocking on.
      - name: lint
        run: bun run lint

      - name: test
        run: bunx vitest run

      # `bun run build` here is apps/client's own `tsc -b && vite build`, which
      # runs without the Tauri shell (the root `bun run build` is `tauri build`
      # and is intentionally not run in CI — it needs the Tauri toolchain and
      # webkit2gtk/GTK system libs).
      - name: build
        run: bun run build
