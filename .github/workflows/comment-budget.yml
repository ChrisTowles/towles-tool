name: Comment budget

# Judges every file a PR touches, whole (`--whole-files`) — not only the lines it
# adds. Touch a file and you own its comment volume: that is the point, and it is
# what drains the backlog instead of merely holding it. The cost is real and
# deliberate — a one-line fix in a prose-heavy legacy file means cleaning that
# file first, so budget for it. `--all` is the whole-repo backlog view, run by
# hand — never wire it to `pull_request`, and never lower the budgets to make
# either one pass.
#
# It is its own workflow rather than a step in `rust`/`frontend` because it is
# the one gate spanning both: `rust` is paths-ignored for apps/client and
# scripts, and `frontend` has no cargo toolchain. Split across the two, a
# TS-only PR would run no comment budget at all.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: comment-budget-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  comment-lint:
    name: Comment volume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the merge-base needs the base branch's history, not a shallow tip
      - name: Provision pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The PR's own base, not `main` — a stacked PR is judged against what it
      # actually branched from.
      - run: cargo comment-budget --whole-files --new-from-merge-base "${{ github.base_ref || 'main' }}"
