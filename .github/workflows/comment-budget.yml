name: Comment budget

# The ratchet: a PR fails only if it grows a touched file's comment excess or
# adds a 13+ line comment block (or grows one by 5+). The base is the PR's own
# (`GITHUB_BASE_REF`, which the binary reads), so a stacked PR is judged against
# what it branched from. `--all` is the backlog view, run by hand; never wire it
# here.
#
# Its own workflow rather than a step in `rust`/`frontend` because it is the one
# gate spanning both: `rust` is paths-ignored for apps/client and scripts, and
# `frontend` has no cargo toolchain.
#
# Pushes to main only build it, so main holds the cache every PR restores.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: comment-budget-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  comment-lint:
    name: Comment volume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the merge-base needs the base branch's history, not a shallow tip
      # Same pin, and the same strip of stray toolchains, as ci.yml's `rust` job.
      - name: Provision pinned Rust toolchain
        run: |
          rustup toolchain install
          active=$(rustup show active-toolchain | awk '{print $1}')
          for tc in $(rustup toolchain list | awk '{print $1}'); do
            [ "$tc" = "$active" ] || rustup toolchain uninstall "$tc"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `cargo comment-budget` spelled out with the ci profile: the dev profile
      # builds every dependency at opt-level 3.
      - if: github.event_name == 'pull_request'
        run: cargo run --quiet --profile ci --package comment-budget --
      - if: github.event_name != 'pull_request'
        run: cargo build --profile ci --package comment-budget
