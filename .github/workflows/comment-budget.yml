name: Comment budget

# The ratchet: a PR fails only if it grows a touched file's comment excess or
# adds a 13+ line comment block (or grows one by 5+). The base is the PR's own
# (`GITHUB_BASE_REF`, which the binary reads), so a stacked PR is judged against
# what it branched from. `--all` is the backlog view, run by hand; never wire it
# here.
#
# Its own workflow rather than a step in `rust`/`frontend` because it is the one
# gate spanning both: `rust` is paths-ignored for apps/client and scripts, and
# `frontend` has no cargo toolchain.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: comment-budget-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  comment-lint:
    name: Comment volume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the merge-base needs the base branch's history, not a shallow tip
      - name: Provision pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo comment-budget
