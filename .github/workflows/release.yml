name: Release

# Cut a release from main: bump `version` in crates-tauri/tt-app/tauri.conf.json
# (and tt-app's Cargo.toml to match), merge, then run this workflow. It tags
# `v<version>`, builds and signs every platform into a draft, and publishes the
# draft only once all of them succeeded — publishing is what moves
# `releases/latest/download/latest.json`, the manifest installed apps poll, so
# a half-built release is never offered as an update.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from tauri.conf.json
        id: version
        run: echo "version=$(jq -r .version crates-tauri/tt-app/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v9
        with:
          script: |
            const tag = "v${{ steps.version.outputs.version }}";
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Towles Tool ${tag}`,
              draft: true,
              generate_release_notes: true,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            name: linux
            args: "--bundles deb,appimage"
          - platform: macos-latest
            name: macos-arm
            args: "--target aarch64-apple-darwin"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      name: ${{ matrix.name }}
      args: ${{ matrix.args }}
      release-id: ${{ needs.create-release.outputs.release-id }}
      no-cache: true
    secrets: inherit

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release-id }},
              draft: false,
              make_latest: "true",
            });
